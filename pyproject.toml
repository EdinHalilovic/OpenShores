[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openshores"
version = "0.1.0"
description = "An open-source server for Shores of Hazeron."
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Aerxesius" }]

dependencies = [
    "asyncpg>=0.30",
    "uvloop>=0.21 ; sys_platform != 'win32'",
    "numpy>=2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[project.scripts]
openshores = "openshores.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/openshores"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src", "tools"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tools", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "E501","E741","E702","E703","F841","F401","E701","E731","E402",]

[tool.ruff.lint.per-file-ignores]
"src/openshores/**" = ["I001", "F821"]
